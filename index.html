<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Karus 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --font-body:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono','Courier New',monospace;
  --font-serif:'Playfair Display',Georgia,serif;
  --gold:#c9a84c;--gold2:#e8c56a;--gold3:rgba(201,168,76,0.08);
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;
  --teal:#14b8a6;--purple:#a78bfa;--blue:#60a5fa;--grey:#64748b;
  --r:10px;--rl:14px;--nav-h:56px;--bot-h:60px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{--bg:#0a0f1e;--s1:#0f1729;--s2:#141e32;--s3:#1a2540;--border:rgba(201,168,76,0.12);--border2:rgba(201,168,76,0.22);--slate:#6b7fa0;--slate2:#8a9ab8;--text:#d8dfe8;--white:#f0f3f8;}
[data-theme="light"]{--bg:#f0f4ff;--s1:#ffffff;--s2:#f5f7fc;--s3:#e8ecf8;--border:rgba(100,116,180,0.15);--border2:rgba(100,116,180,0.3);--slate:#64748b;--slate2:#475569;--text:#1e293b;--white:#0f172a;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;font-size:14px;line-height:1.5;transition:background .3s,color .3s;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--s1);}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px;}

/* ═══ AUTH ═══ */
.auth-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:1.5rem;}
.auth-box{background:var(--s1);border:1px solid var(--border2);border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,0.4);}
.auth-logo{text-align:center;margin-bottom:2rem;}
.auth-logo-name{font-family:var(--font-serif);font-size:2rem;font-weight:700;color:var(--gold);}
.auth-logo-sub{font-family:var(--font-mono);font-size:.7rem;color:var(--slate);letter-spacing:.15em;margin-top:.2rem;}
.auth-tabs{display:flex;background:var(--s2);border-radius:var(--r);padding:.25rem;margin-bottom:1.5rem;gap:.25rem;}
.auth-tab{flex:1;padding:.55rem;text-align:center;border-radius:7px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--slate);transition:all .2s;border:none;background:none;font-family:var(--font-body);}
.auth-tab.active{background:var(--s1);color:var(--gold);border:1px solid var(--border2);}
.auth-field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.9rem;}
.auth-field label{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);}
.auth-field input{background:var(--s2);border:1px solid var(--border);color:var(--white);border-radius:var(--r);padding:.65rem .85rem;font-family:var(--font-body);font-size:.9rem;outline:none;-webkit-appearance:none;transition:border-color .2s;}
.auth-field input:focus{border-color:var(--gold);}
.auth-btn{width:100%;background:var(--gold);color:#0a0f1e;border:none;border-radius:var(--r);padding:.75rem;font-family:var(--font-body);font-size:.9rem;font-weight:700;cursor:pointer;margin-top:.5rem;transition:background .15s;}
.auth-btn:hover{background:var(--gold2);}
.auth-error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:var(--red);border-radius:var(--r);padding:.65rem .85rem;font-size:.8rem;margin-bottom:.9rem;display:none;}
.auth-error.show{display:block;}

/* ═══ HEADER ═══ */
.app-header{background:var(--s1);border-bottom:1px solid var(--border2);padding:0 1.5rem;display:flex;align-items:stretch;position:sticky;top:0;z-index:200;height:var(--nav-h);}
.logo{display:flex;align-items:center;gap:10px;padding-right:1.5rem;border-right:1px solid var(--border);flex-shrink:0;}
.logo-name{font-family:var(--font-serif);font-size:.95rem;font-weight:600;color:var(--white);line-height:1.1;}
.logo-year{font-family:var(--font-mono);font-size:.6rem;color:var(--gold);letter-spacing:.12em;}
.nav-tabs{display:flex;align-items:stretch;flex:1;overflow-x:auto;scrollbar-width:none;margin-left:.5rem;}
.nav-tabs::-webkit-scrollbar{display:none;}
.tab-btn{background:none;border:none;color:var(--slate2);font-family:var(--font-body);font-size:.73rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:0 1.1rem;cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;white-space:nowrap;}
.tab-btn:hover{color:var(--white);}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
.header-right{display:flex;align-items:center;gap:.6rem;padding-left:1rem;border-left:1px solid var(--border);flex-shrink:0;}
.header-email{font-size:.7rem;color:var(--slate);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.icon-btn{background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:.3rem .6rem;font-size:.75rem;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:var(--font-body);}
.icon-btn:hover{border-color:var(--border2);}
.outlook-btn{background:rgba(0,120,212,.15);border:1px solid rgba(0,120,212,.3);color:#4da3e8;border-radius:6px;padding:.3rem .65rem;font-size:.68rem;font-weight:600;cursor:pointer;font-family:var(--font-body);white-space:nowrap;}
.outlook-btn.connected{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3);color:var(--green);}
.signout-btn{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red);border-radius:6px;padding:.3rem .65rem;font-size:.68rem;font-weight:600;cursor:pointer;font-family:var(--font-body);}

/* ═══ GLOBAL SEARCH ═══ */
.global-search-wrap{position:relative;flex-shrink:0;}
.global-search{background:var(--s2);border:1px solid var(--border);color:var(--white);border-radius:20px;padding:.35rem .85rem .35rem 2rem;font-family:var(--font-body);font-size:.78rem;outline:none;width:180px;transition:all .2s;}
.global-search:focus{border-color:var(--gold);width:240px;}
.global-search-icon{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:var(--slate);font-size:.75rem;pointer-events:none;}
.global-search-results{position:absolute;top:calc(100% + .5rem);right:0;width:320px;background:var(--s1);border:1px solid var(--border2);border-radius:var(--rl);box-shadow:0 12px 40px rgba(0,0,0,0.4);z-index:500;max-height:400px;overflow-y:auto;display:none;}
.global-search-results.show{display:block;}
.search-result-item{padding:.75rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.search-result-item:hover{background:var(--gold3);}
.search-result-item:last-child{border-bottom:none;}
.search-result-type{font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);margin-bottom:.2rem;}
.search-result-name{font-size:.82rem;color:var(--white);font-weight:600;}
.search-result-sub{font-size:.7rem;color:var(--slate);margin-top:.1rem;}

/* ═══ SAVE INDICATOR ═══ */
.save-indicator{position:fixed;bottom:calc(var(--bot-h) + var(--safe-b) + .75rem);right:1rem;background:var(--s1);border:1px solid var(--border2);border-radius:8px;padding:.4rem .85rem;font-size:.72rem;color:var(--slate);z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;font-family:var(--font-mono);}
.save-indicator.show{opacity:1;}
.save-indicator.saving{color:var(--amber);}
.save-indicator.saved{color:var(--green);}

/* ═══ REMINDER BANNER ═══ */
.reminder-banner{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);border-radius:var(--r);padding:.75rem 1rem;margin-bottom:1rem;display:none;}
.reminder-banner.show{display:block;}
.reminder-banner-title{font-size:.72rem;font-weight:700;color:var(--amber);margin-bottom:.4rem;}
.reminder-item{font-size:.78rem;color:var(--text);display:flex;align-items:center;gap:.5rem;padding:.2rem 0;cursor:pointer;}
.reminder-item:hover .reminder-name{color:var(--gold);}
.reminder-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex-shrink:0;}

/* ═══ PACING WIDGET ═══ */
.pacing-bar{background:var(--s1);border:1px solid var(--border2);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1rem;}
.pacing-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;}
.pacing-title{font-family:var(--font-serif);font-size:.85rem;color:var(--gold);font-weight:600;}
.pacing-status{font-size:.72rem;font-weight:700;padding:.2rem .6rem;border-radius:20px;}
.pacing-status.ahead{background:rgba(34,197,94,.15);color:var(--green);}
.pacing-status.behind{background:rgba(239,68,68,.15);color:var(--red);}
.pacing-status.on-track{background:rgba(245,158,11,.15);color:var(--amber);}
.pacing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem;margin-bottom:.75rem;}
.pacing-item{background:var(--s2);border-radius:var(--r);padding:.65rem .85rem;}
.pacing-item-label{font-size:.6rem;color:var(--slate);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.2rem;}
.pacing-item-val{font-family:var(--font-mono);font-size:.95rem;font-weight:600;color:var(--white);}
.pacing-item-sub{font-size:.65rem;color:var(--slate);margin-top:.1rem;}
.pacing-track{height:8px;background:var(--s2);border-radius:4px;overflow:visible;position:relative;margin-top:.5rem;}
.pacing-fill{height:100%;border-radius:4px;transition:width .7s cubic-bezier(.4,0,.2,1);}
.pacing-marker{position:absolute;top:-4px;width:2px;height:16px;background:var(--slate2);border-radius:1px;}
.pacing-marker-label{position:absolute;top:18px;font-size:.58rem;color:var(--slate);transform:translateX(-50%);white-space:nowrap;}

/* ═══ BOTTOM NAV ═══ */
.bot-nav{display:none;}

/* ═══ PAGES ═══ */
.page{display:none;padding:1.25rem 1.5rem 2rem;animation:fadeUp .22s ease;}
.page.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ═══ KPI ═══ */
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:.75rem;margin-bottom:1.1rem;}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;position:relative;overflow:hidden;transition:border-color .2s,transform .15s;}
.kpi:hover{border-color:var(--border2);transform:translateY(-1px);}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:2px;}
.kpi.gold .kpi-accent{background:var(--gold);}.kpi.green .kpi-accent{background:var(--green);}.kpi.red .kpi-accent{background:var(--red);}.kpi.teal .kpi-accent{background:var(--teal);}.kpi.purple .kpi-accent{background:var(--purple);}.kpi.amber .kpi-accent{background:var(--amber);}.kpi.blue .kpi-accent{background:var(--blue);}.kpi.grey .kpi-accent{background:var(--grey);}
.kpi-label{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);margin-bottom:.45rem;}
.kpi-value{font-family:var(--font-mono);font-size:1.45rem;font-weight:600;color:var(--white);letter-spacing:-.02em;line-height:1;}
.kpi-sub{font-size:.68rem;color:var(--slate);margin-top:.35rem;}

/* ═══ CARDS ═══ */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--rl);padding:1.1rem 1.25rem;transition:border-color .2s;}
.card:hover{border-color:var(--border2);}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.card-title{font-family:var(--font-serif);font-size:.85rem;font-weight:600;color:var(--gold);}

/* ═══ LAYOUT ═══ */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;}
.grid-12{display:grid;grid-template-columns:1.45fr 1fr;gap:1rem;}
.mb-1{margin-bottom:1rem;}
.chart-wrap{position:relative;height:220px;}
.chart-wrap.sm{height:160px;}

/* ═══ WEEKLY SUMMARY ═══ */
.weekly-summary{background:linear-gradient(135deg,rgba(201,168,76,.08) 0%,rgba(201,168,76,.03) 100%);border:1px solid var(--border2);border-radius:var(--rl);padding:1.1rem 1.25rem;margin-bottom:1rem;}
.weekly-summary-title{font-family:var(--font-serif);font-size:.85rem;color:var(--gold);margin-bottom:.85rem;}
.weekly-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.75rem;}
.weekly-stat{text-align:center;}
.weekly-stat-val{font-family:var(--font-mono);font-size:1.2rem;font-weight:600;color:var(--white);}
.weekly-stat-label{font-size:.62rem;color:var(--slate);text-transform:uppercase;letter-spacing:.08em;margin-top:.2rem;}
.weekly-stat-change{font-family:var(--font-mono);font-size:.68rem;margin-top:.15rem;}
.weekly-stat-change.up{color:var(--green);}
.weekly-stat-change.down{color:var(--red);}
.weekly-stat-change.neutral{color:var(--slate);}

/* ═══ BEST PERFORMERS ═══ */
.best-item{display:flex;align-items:center;gap:.75rem;padding:.55rem 0;border-bottom:1px solid var(--border);}
.best-item:last-child{border-bottom:none;}
.best-rank{font-family:var(--font-mono);font-size:.7rem;color:var(--slate);width:18px;flex-shrink:0;}
.best-rank.gold{color:var(--gold);}
.best-label{flex:1;font-size:.8rem;color:var(--text);}
.best-val{font-family:var(--font-mono);font-size:.78rem;color:var(--gold2);font-weight:600;}

/* ═══ PIPELINE ═══ */
.pipeline-wrap{display:flex;gap:.75rem;overflow-x:auto;padding-bottom:.5rem;-webkit-overflow-scrolling:touch;}
.pipeline-col{flex-shrink:0;width:220px;}
.pipeline-col-header{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.5rem .75rem;border-radius:6px 6px 0 0;margin-bottom:.4rem;}
.pipeline-card{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:.75rem;margin-bottom:.4rem;cursor:pointer;transition:all .15s;}
.pipeline-card:hover{border-color:var(--border2);transform:translateY(-1px);}
.pipeline-card-name{font-size:.8rem;font-weight:600;color:var(--white);margin-bottom:.25rem;}
.pipeline-card-meta{font-size:.68rem;color:var(--slate);}
.pipeline-card-date{font-family:var(--font-mono);font-size:.65rem;color:var(--slate);margin-top:.2rem;}
.pipeline-count{font-family:var(--font-mono);font-size:.68rem;color:var(--slate);padding:.2rem .5rem;background:var(--s3);border-radius:10px;margin-left:.4rem;}

/* ═══ FORECAST ═══ */
.forecast-row{display:flex;align-items:center;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--border);}
.forecast-row:last-child{border-bottom:none;}
.forecast-month{font-size:.72rem;font-weight:700;color:var(--slate2);text-transform:uppercase;letter-spacing:.06em;width:36px;flex-shrink:0;}
.forecast-bar-wrap{flex:1;height:6px;background:var(--s2);border-radius:3px;overflow:hidden;}
.forecast-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .7s cubic-bezier(.4,0,.2,1);}
.forecast-bar.projected{background:rgba(201,168,76,.35);}
.forecast-val{font-family:var(--font-mono);font-size:.72rem;color:var(--white);width:70px;text-align:right;flex-shrink:0;}
.forecast-tag{font-size:.6rem;padding:.1rem .35rem;border-radius:3px;flex-shrink:0;}
.forecast-tag.actual{background:rgba(34,197,94,.12);color:var(--green);}
.forecast-tag.projected{background:rgba(201,168,76,.12);color:var(--gold);}

/* ═══ EXPORT BTN ═══ */
.export-btn{background:rgba(20,184,166,.12);border:1px solid rgba(20,184,166,.25);color:var(--teal);border-radius:var(--r);padding:.45rem .85rem;font-family:var(--font-body);font-size:.75rem;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.export-btn:hover{background:rgba(20,184,166,.2);}

/* ═══ CLIENT ═══ */
.client-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--rl);padding:1.25rem;transition:border-color .2s,transform .15s;cursor:pointer;}
.client-card:hover{border-color:var(--border2);transform:translateY(-2px);}
.client-name{font-family:var(--font-serif);font-size:1rem;color:var(--white);font-weight:600;margin-bottom:.35rem;}
.client-meta{font-size:.72rem;color:var(--slate);margin-bottom:.65rem;}
.client-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem;}
.client-stat{background:var(--s2);border-radius:6px;padding:.45rem .5rem;text-align:center;}
.client-stat-val{font-family:var(--font-mono);font-size:.82rem;font-weight:600;color:var(--white);}
.client-stat-label{font-size:.58rem;color:var(--slate);text-transform:uppercase;letter-spacing:.06em;margin-top:.1rem;}

/* ═══ COMMISSION CALENDAR ═══ */
.comm-cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.5rem;}
.comm-cal-month{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:.75rem;text-align:center;transition:border-color .2s;}
.comm-cal-month.has-payout{border-color:var(--border2);background:linear-gradient(135deg,rgba(201,168,76,.08),rgba(201,168,76,.02));}
.comm-cal-label{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--slate);margin-bottom:.35rem;}
.comm-cal-val{font-family:var(--font-mono);font-size:.88rem;font-weight:600;color:var(--gold2);}
.comm-cal-sub{font-size:.6rem;color:var(--slate);margin-top:.2rem;}

/* ═══ SOURCE ROI ═══ */
.source-roi-row{display:flex;align-items:center;gap:.75rem;padding:.65rem 0;border-bottom:1px solid var(--border);}
.source-roi-row:last-child{border-bottom:none;}
.source-roi-name{font-size:.8rem;font-weight:600;color:var(--white);flex:1;}
.source-roi-grid{display:grid;grid-template-columns:repeat(3,80px);gap:.4rem;flex-shrink:0;}
.source-roi-cell{text-align:center;}
.source-roi-val{font-family:var(--font-mono);font-size:.72rem;color:var(--white);}
.source-roi-label{font-size:.58rem;color:var(--slate);text-transform:uppercase;letter-spacing:.05em;}

/* ═══ DUP WARNING ═══ */
.dup-warning{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);border-radius:var(--r);padding:.65rem .85rem;font-size:.78rem;color:var(--amber);margin-bottom:.75rem;display:none;}
.dup-warning.show{display:block;}
.dup-link{color:var(--gold);text-decoration:underline;cursor:pointer;}

/* ═══ PRODUCT TARGET ═══ */
.prod-target-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.8rem;}
.prod-target-label{font-size:.75rem;font-weight:600;width:60px;flex-shrink:0;}
.prod-target-bar-wrap{flex:1;height:8px;background:var(--s2);border-radius:4px;overflow:hidden;}
.prod-target-bar{height:100%;border-radius:4px;transition:width .7s cubic-bezier(.4,0,.2,1);}
.prod-target-pct{font-family:var(--font-mono);font-size:.68rem;color:var(--slate);width:40px;text-align:right;flex-shrink:0;}

/* ═══ OUTLOOK CAL ═══ */
.outlook-panel{background:var(--s1);border:1px solid var(--border);border-radius:var(--rl);padding:1.1rem 1.25rem;margin-bottom:1rem;}
.outlook-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.75rem;}
.outlook-panel-title{font-family:var(--font-serif);font-size:.85rem;font-weight:600;color:var(--gold);}
.outlook-panel-controls{display:flex;gap:.5rem;align-items:center;}
.cal-nav-btn{background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:.35rem .65rem;cursor:pointer;font-size:.8rem;font-family:var(--font-body);}
.cal-nav-btn:hover{border-color:var(--border2);}
.cal-week-label{font-family:var(--font-mono);font-size:.75rem;color:var(--slate2);min-width:140px;text-align:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem;}
.cal-day{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:.5rem;min-height:90px;}

select.filter-sel{background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:var(--r);padding:.5rem .7rem;font-family:var(--font-body);font-size:.78rem;cursor:pointer;outline:none;-webkit-appearance:none;}

.btn-sm{padding:.28rem .6rem;font-size:.7rem;}
.btn-clear{background:transparent;border:1px solid rgba(239,68,68,.3);color:var(--red);border-radius:var(--r);padding:.5rem .75rem;font-family:var(--font-body);font-size:.72rem;cursor:pointer;transition:all .15s;white-space:nowrap;}

.count-label{font-size:.7rem;color:var(--slate);margin-left:auto;font-family:var(--font-mono);}

.seen-chk,.paid-chk{appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:4px;cursor:pointer;border:1.5px solid var(--border2);background:var(--s2);display:inline-flex;align-items:center;justify-content:center;transition:all .15s;vertical-align:middle;position:relative;flex-shrink:0;}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;}

.bar-track{width:100%;height:5px;background:var(--s2);border-radius:3px;overflow:hidden;}

.target-goal-label{font-family:var(--font-mono);font-size:.58rem;color:var(--slate);margin-top:.18rem;text-align:right;}

.ratio-cell{text-align:center;}
.ratio-pill{display:inline-block;padding:.15rem .45rem;border-radius:4px;min-width:38px;font-size:.65rem;font-weight:600;font-family:var(--font-mono);text-align:center;}

.prod{font-weight:700;font-family:var(--font-mono);font-size:.7rem;}

.section-heading{font-size:.6rem;font-weight:700;color:var(--slate);letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:.45rem;margin-bottom:.8rem;margin-top:1.1rem;}
